<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>पौड्याल बंशावली — छिस्ती, बाग्लुङ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>पौड्याल बंशावली <span class="origin">— छिस्ती, बाग्लुङबाट फैलिएको</span></h1>
    <p>गंगाधरका सन्तानहरू</p>
  </header>
  <nav id="tabs" role="tablist" aria-label="सात दाजुभाइ"></nav>
  <main>
    <div class="toolbar">
      <button type="button" id="edit-toggle" class="primary"></button>
      <button type="button" id="download">डेटा डाउनलोड</button>
      <label class="file-btn">डेटा फाइल खोल्नुहोस्<input type="file" id="upload" accept=".js,.json"></label>
      <button type="button" id="reset">सुरुमा फर्कनुहोस्</button>
      <span id="status" role="status"></span>
    </div>
    <div class="legend"><span class="m">छोरा</span><span class="f">छोरी</span><span class="s">श्रीमती (तलका सन्तानकी आमा)</span></div>
    <p class="hint">बाकसमा थिचेर नाम Roman मा लेख्नुहोस् (जस्तै <i>ram prasad</i>) — आफैं नेपालीमा बदलिन्छ। “+ छोरा / + छोरी” ले नयाँ हाँगा थपिन्छ। भरिएका कुरा यही ब्राउजरमा आफैं सुरक्षित हुन्छन्।</p>
    <section id="panel" role="tabpanel"></section>
  </main>
  <script src="data.js"></script>
  <script src="translit.js"></script>
  <script src="app.js"></script>
</body>
</html>
